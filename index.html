<html lang="en">

  <style>

</head>
<body>
  <main id="stage">
    <canvas id="art" aria-label="Gradient generated from the uploaded image"></canvas>
    <img class="source-image" id="sourceImage" alt="Uploaded input image" hidden>
    <div class="empty-state" id="emptyState">UPLOAD A PNG OR JPG TO CREATE AN AMBIENT GRADIENT</div>
    <aside class="island" aria-label="Gradient controls">
      <section class="panel-section">
        <div class="section-heading">01 / SOURCE</div>
        <button class="panel-button" id="upload">UPLOAD IMAGE <span>↗</span></button>
        <input id="file" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg">
        <button class="panel-button secondary" id="toggleImage" disabled aria-pressed="false">SHOW INPUT IMAGE</button>
        <div class="source-thumb" id="sourceThumb" hidden><span>HIDDEN INPUT</span><img id="sourceThumbImage" alt="Hidden source image thumbnail"></div>
      </section>
      <section class="panel-section">
        <label class="section-heading" for="method">02 / METHOD</label>
        <select class="method-select" id="method">
          <option value="stripes">SCAN STRIPES</option>
          <option value="soft">SOFT SCAN</option>
          <option value="accent">ACCENT SCAN</option>
          <option value="zen">ZEN FIELD</option>
          <option value="story">COLOUR STORY</option>
        </select>
        <p class="method-note" id="methodNote"></p>
        <label class="label-row" for="scanWidth"><span>SCAN WIDTH</span><output id="scanWidthValue">12%</output></label>
        <input id="scanWidth" type="range" min="4" max="40" value="12">
        <label class="label-row" for="softness"><span>EDGE SOFTNESS</span><output id="softnessValue">28%</output></label>
        <input id="softness" type="range" min="0" max="100" value="28">
      </section>
      <section class="panel-section">
        <div class="section-heading">03 / MOTION</div>
        <label class="label-row" for="motionAmount"><span>AMOUNT</span><output id="motionAmountValue">55%</output></label>
        <input id="motionAmount" type="range" min="0" max="100" value="55">
        <label class="label-row" for="motionSpeed"><span>SPEED</span><output id="motionSpeedValue">70%</output></label>
        <input id="motionSpeed" type="range" min="0" max="100" value="70">
        <p class="motion-note" id="motionNote"></p>
      </section>
      <section class="panel-section">
        <div class="section-heading">04 / RENDER</div>
        <div class="render-toggle" role="group" aria-label="Gradient rendering"><button data-style="pixel">PIXEL</button><button class="active" data-style="smooth">SMOOTH</button></div>
        <label class="label-row" for="resolution"><span>PIXEL DETAIL</span><output id="resolutionValue">95%</output></label>
        <input id="resolution" type="range" min="20" max="100" value="95" disabled>
      </section>
      <section class="panel-section palette" aria-label="Extracted key colours">
        <div class="palette-heading"><span id="paletteTitle">KEY COLOURS</span><button id="copyPalette" aria-label="Copy palette details">COPY ↗</button></div>
        <div class="swatches" id="swatches"></div>
      </section>
      <div class="export-actions">
        <button class="panel-button export" id="export">EXPORT PNG <span id="exportResolution">— × — px</span></button>
        <div class="export-secondary"><button class="panel-button" id="exportSvg">EXPORT SVG</button><button class="panel-button" id="recordVideo">RECORD VIDEO</button></div>
        <p class="export-note">SVG is a still image. Video records 8 seconds of the moving gradient.</p>
      </div>
    </aside>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <script>
    const demoColors=['#d8d3c9','#93aca2','#c4aab9','#485a5b'];

    const state={style:'smooth',method:'stripes',resolution:95,scanWidth:12,softness:28,motionAmount:55,motionSpeed:70,inputImage:null,imageProfile:null,profilePixels:null,framePixels:null,shiftedProfile:null,imageColors:null,imageVisible:true,sourceUrl:null,frame:0};
    const canvas=document.querySelector('#art'),stage=document.querySelector('#stage'),sourceImage=document.querySelector('#sourceImage');

    function paint(target,w,h,time=performance.now()){

      ctx.clearRect(0,0,w,h);
      if(state.imageProfile){
        const profile=state.imageProfile,profileHeight=profile.height,speed=state.motionSpeed/100,period=70-speed*40,longPeriod=115-speed*50,tintPeriod=longPeriod*1.25,phase=time*Math.PI*2/(period*1000),slowPhase=time*Math.PI*2/(longPeriod*1000),tintPhase=time*Math.PI*2/(tintPeriod*1000);
        const shifted=state.shiftedProfile.getContext('2d'),row=shifted.createImageData(1,profileHeight),pixels=state.profilePixels;

          const band=y/profileHeight*6,index=Math.min(5,Math.floor(band)),blend=band-index,smooth=blend*blend*(3-2*blend);

        shifted.putImageData(row,0,0);

        const blur=Math.min(3,h*.002);ctx.filter=state.style==='smooth'?`blur(${blur}px)`:'none';

        const gradient=ctx.createLinearGradient(0,0,0,h);
        colors.forEach((color,i)=>gradient.addColorStop(i/(colors.length-1),color));

      }
    }
    function draw(time=performance.now()){
      if(state.frame)cancelAnimationFrame(state.frame);
      paint(canvas,canvas.width,canvas.height,time);
      if(state.imageProfile)state.frame=requestAnimationFrame(draw);
    }
    function exportSize(){const r=stage.getBoundingClientRect(),scale=Math.min(devicePixelRatio||1,2);return {width:Math.max(90,Math.round(r.width*scale)),height:Math.max(70,Math.round(r.height*scale)),scale}}
    function resize(){const size=exportSize(),detail=state.style==='pixel'?state.resolution/100:1;canvas.width=size.width;canvas.height=Math.max(70,Math.round(size.height*detail));canvas.classList.toggle('pixelated',state.style==='pixel');document.querySelector('#exportResolution').textContent=`${size.width} × ${size.height} px`;draw()}
    function updateMotionNote(){
      const speed=state.motionSpeed/100,period=Math.round(70-speed*40),longPeriod=Math.round(115-speed*50),base=state.method==='stripes'?7:state.method==='zen'?4:5;
      document.querySelector('#motionNote').textContent=`Six y-zones shift independently. Two sine waves move brightness by up to ±${(base*state.motionAmount/100).toFixed(1)} RGB over ${period}s / ${longPeriod}s, with a subtle warm–cool tint. Amount controls distance; Speed controls cycle time.`;
    }
    function drawVisibleSource(target){
      if(!state.imageVisible||!sourceImage.complete||!sourceImage.naturalWidth)return;
      const stageRect=stage.getBoundingClientRect(),imageRect=sourceImage.getBoundingClientRect(),scale=target.width/stageRect.width;
      target.getContext('2d').drawImage(sourceImage,(imageRect.left-stageRect.left)*scale,(imageRect.top-stageRect.top)*scale,imageRect.width*scale,imageRect.height*scale);
    }
    function renderPalette(){
      const entries=state.imageColors?.map(hex=>({hex,role:keyColorRole(hex)}))||[];
      document.querySelector('#paletteTitle').textContent=entries.length?`KEY COLOURS / ${String(entries.length).padStart(2,'0')}`:'KEY COLOURS / AWAITING IMAGE';
      document.querySelector('#copyPalette').disabled=!entries.length;
      document.querySelector('#swatches').innerHTML=entries.map(({hex,role})=>`<button class="swatch" type="button" data-copy="${hex}" aria-label="Copy ${hex} ${role}"><span class="swatch-dot" style="--swatch:${hex}"></span><span class="swatch-name"><strong>${role}</strong><span class="hex">${hex}</span></span></button>`).join('');
      document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
    }
    function makeProfile(img,algorithm='center'){
      const w=Math.min(256,img.naturalWidth),h=Math.min(768,img.naturalHeight);
      const sample=document.createElement('canvas'),sampleCtx=sample.getContext('2d',{willReadFrequently:true});sample.width=w;sample.height=h;sampleCtx.fillStyle='#fff';sampleCtx.fillRect(0,0,w,h);sampleCtx.imageSmoothingEnabled=true;sampleCtx.imageSmoothingQuality='high';sampleCtx.drawImage(img,0,0,w,h);
      const pixels=sampleCtx.getImageData(0,0,w,h).data,profile=document.createElement('canvas'),profileCtx=profile.getContext('2d',{willReadFrequently:true});profile.width=1;profile.height=h;
      const row=profileCtx.createImageData(1,h);
      const setMode=(y,left,right,accent=false)=>{
        const bins=new Map();
        for(let x=Math.max(0,left);x<Math.min(w,right);x++){
          const p=(y*w+x)*4,a=pixels[p+3]/255,r=pixels[p]*a+255*(1-a),g=pixels[p+1]*a+255*(1-a),b=pixels[p+2]*a+255*(1-a),key=(r>>4)*256+(g>>4)*16+(b>>4),bin=bins.get(key)||[0,0,0,0];
          bin[0]+=r;bin[1]+=g;bin[2]+=b;bin[3]++;bins.set(key,bin);
        }
        let mode=null,best=-Infinity;for(const bin of bins.values())if(bin[3]>best){mode=bin;best=bin[3]}

        if(accent&&mode){
          const minCount=Math.max(1,(Math.min(w,right)-Math.max(0,left))*.025);let vivid=null,vividScore=0;
          for(const bin of bins.values()){
            const candidate=bin.slice(0,3).map(value=>value/bin[3]),max=Math.max(...candidate),min=Math.min(...candidate),saturation=max?(max-min)/max:0,separation=Math.hypot(...candidate.map((value,c)=>value-color[c]));

          }
          if(vivid){const accentColor=vivid.slice(0,3).map(value=>value/vivid[3]),mix=Math.min(.56,.14+vivid[3]/Math.max(1,right-left)*1.4),baseLab=toLab(color),accentLab=toLab(accentColor);color=fromLab(baseLab.map((value,c)=>value*(1-mix)+accentLab[c]*mix))}
        }
        const i=y*4;row.data[i]=color[0];row.data[i+1]=color[1];row.data[i+2]=color[2];row.data[i+3]=255;
      };
      if(algorithm==='story'&&state.imageColors?.length){
          const anchors=state.imageColors.map(hex=>({color:rgb(hex),sum:0,mass:0}));
        for(let y=0;y<h;y++)for(let x=0;x<w;x++){
          const p=(y*w+x)*4,a=pixels[p+3]/255,color=[pixels[p]*a+255*(1-a),pixels[p+1]*a+255*(1-a),pixels[p+2]*a+255*(1-a)];

          const position=y/Math.max(1,h-1);while(index<anchors.length-2&&position>anchors[index+1].position)index++;

    }

    function bilateralProfile(pixels,height,softness){

    }
    function toLab(color){

    function fromLab([L,a,b]){

      const linear=[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s];

    }
    function extractColors(img){
      const scale=Math.min(1,192/Math.max(img.naturalWidth,img.naturalHeight)),sample=document.createElement('canvas'),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
      sample.width=w;sample.height=h;const sampleCtx=sample.getContext('2d',{willReadFrequently:true});sampleCtx.drawImage(img,0,0,w,h);

    }
    function extractColorsFromPixels(raw,w,h){
      const bins=new Map(),accents=new Map(),total=w*h;
      // ponytail: 4-bit RGB modes and a 40% cutoff keep palettes concise; lower it if fine shades matter.
      for(let i=0;i<raw.length;i+=4){
        const alpha=raw[i+3]/255,r=raw[i]*alpha+255*(1-alpha),g=raw[i+1]*alpha+255*(1-alpha),b=raw[i+2]*alpha+255*(1-alpha),key=(r>>4)*256+(g>>4)*16+(b>>4),bin=bins.get(key)||[0,0,0,0];bin[0]+=r;bin[1]+=g;bin[2]+=b;bin[3]++;bins.set(key,bin);
        const max=Math.max(r,g,b),min=Math.min(r,g,b),delta=max-min,saturation=max?delta/max:0,value=max/255;let hue=0;
        if(delta){if(max===r)hue=((g-b)/delta+(g<b?6:0))/6;else if(max===g)hue=((b-r)/delta+2)/6;else hue=((r-g)/delta+4)/6}
        if(saturation>.28&&value>.78){const hueBin=Math.floor(hue*24),accent=accents.get(hueBin)||[0,0,0,0,0,0];accent[0]+=r;accent[1]+=g;accent[2]+=b;accent[3]++;accent[4]+=saturation;accent[5]+=value;accents.set(hueBin,accent)}
      }

        const color=[r/count,g/count,b/count],max=Math.max(...color)/255,min=Math.min(...color)/255,saturation=max?(max-min)/max:0,value=max,share=count/total;
        return {color,count,saturation,value,score:Math.sqrt(share)*(.52+.48*saturation+(value>.84&&saturation<.16?.2:0))};
      }).sort((a,b)=>b.score-a.score);
      const chosen=[],minimumSupport=Math.max(2,Math.ceil(total*.00015)),distance=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
      while(chosen.length<10){
        let best=null,bestScore=0;
        for(const candidate of candidates){
          if(candidate.count<minimumSupport)continue;

      for(const item of chosen)if(colors.every(color=>distance(color,item.color)>30))colors.push(item.color);
      return colors.slice(0,10).map(hexOf);
    }
    function installProfile(img){
      const algorithm=state.method==='story'?'story':state.method==='accent'?'accent':'center';
      state.imageProfile=makeProfile(img,algorithm);
      const raw=state.imageProfile.getContext('2d',{willReadFrequently:true}).getImageData(0,0,1,state.imageProfile.height).data,height=state.imageProfile.height;
      state.profilePixels=state.method==='soft'?bilateralProfile(raw,height,state.softness):state.method==='zen'?makeZenProfile(raw,height,state.softness):raw;
      state.shiftedProfile=document.createElement('canvas');state.shiftedProfile.width=1;state.shiftedProfile.height=state.imageProfile.height;
    }
    function download(blob,name){const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
    function exportSvg(){
      const rect=stage.getBoundingClientRect(),width=Math.round(rect.width),height=Math.round(rect.height),pixels=state.framePixels||state.profilePixels;
      const stops=pixels?Array.from({length:state.imageProfile.height},(_,y)=>`<stop offset="${100*y/Math.max(1,state.imageProfile.height-1)}%" stop-color="${hexOf(Array.from(pixels.slice(y*4,y*4+3)))}"/>`):currentColors().map((color,i)=>`<stop offset="${100*i/Math.max(1,currentColors().length-1)}%" stop-color="${color}"/>`);
      let image='';
      if(state.imageVisible&&sourceImage.complete&&sourceImage.naturalWidth){
        const r=sourceImage.getBoundingClientRect(),embed=document.createElement('canvas');embed.width=Math.max(1,Math.round(r.width*2));embed.height=Math.max(1,Math.round(r.height*2));embed.getContext('2d').drawImage(sourceImage,0,0,embed.width,embed.height);
        image=`<image x="${r.left-rect.left}" y="${r.top-rect.top}" width="${r.width}" height="${r.height}" href="${embed.toDataURL('image/png')}"/>`;
      }
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">${stops.join('')}</linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/>${image}</svg>`;
      download(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),'ambient-gradient.svg');
    }
    function recordVideo(){
      if(!canvas.captureStream||!window.MediaRecorder){toast('VIDEO RECORDING IS NOT AVAILABLE IN THIS BROWSER');return}
      const {width,height}=exportSize(),out=document.createElement('canvas'),low=state.style==='pixel'?document.createElement('canvas'):null;if(low){low.width=width;low.height=Math.max(70,Math.round(height*state.resolution/100))}out.width=width;out.height=height;
      const stream=out.captureStream(30),types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/mp4'],mime=types.find(type=>MediaRecorder.isTypeSupported?.(type));
      let recorder;try{recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch{stream.getTracks().forEach(track=>track.stop());toast('VIDEO RECORDING IS NOT AVAILABLE IN THIS BROWSER');return}
      const button=document.querySelector('#recordVideo'),chunks=[];button.disabled=true;button.textContent='RECORDING 8S…';
      recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      recorder.onerror=()=>{button.disabled=false;button.textContent='RECORD VIDEO';stream.getTracks().forEach(track=>track.stop());toast('VIDEO RECORDING FAILED')};
      recorder.onstop=()=>{const type=recorder.mimeType||'video/webm',extension=type.includes('mp4')?'mp4':'webm';button.disabled=false;button.textContent='RECORD VIDEO';stream.getTracks().forEach(track=>track.stop());if(chunks.length)download(new Blob(chunks,{type}),`ambient-gradient.${extension}`)};
      recorder.start(250);toast('RECORDING 8 SECONDS');const start=performance.now();
      const frame=now=>{if(low){paint(low,low.width,low.height,now);const ctx=out.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(low,0,0,width,height)}else paint(out,width,height,now);drawVisibleSource(out);if(now-start<8000)requestAnimationFrame(frame);else recorder.stop()};requestAnimationFrame(frame);
    }
    function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1500)}
    async function copy(value){try{await navigator.clipboard.writeText(value)}catch{const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();const copied=document.execCommand('copy');field.remove();if(!copied){toast('COPY FAILED');return}}toast(`${value} COPIED`)}
    document.querySelector('#upload').onclick=()=>document.querySelector('#file').click();
    document.querySelector('#file').onchange=e=>{
      const file=e.target.files[0];e.target.value='';if(!file)return;
      const validExtension=/\.(png|jpe?g)$/i.test(file.name),validType=['image/png','image/jpeg','image/jpg','application/octet-stream'].includes(file.type);
      if(!validExtension||(file.type&&!validType)){toast('PLEASE CHOOSE A PNG OR JPG');return}
      const img=new Image(),url=URL.createObjectURL(file);
      img.onload=()=>{state.imageColors=extractColors(img);state.inputImage=img;installProfile(img);state.imageVisible=true;sourceImage.src=url;sourceImage.hidden=false;document.querySelector('#sourceThumbImage').src=url;document.querySelector('#sourceThumb').hidden=true;if(state.sourceUrl)URL.revokeObjectURL(state.sourceUrl);state.sourceUrl=url;const toggle=document.querySelector('#toggleImage');toggle.disabled=false;toggle.textContent='HIDE INPUT IMAGE';toggle.setAttribute('aria-pressed','true');document.querySelector('#emptyState').hidden=true;renderPalette();resize();updateMotionNote();toast(`${state.imageColors.length} KEY COLOURS EXTRACTED`)};
      img.onerror=()=>{URL.revokeObjectURL(url);toast('COULD NOT READ THIS IMAGE')};img.src=url;
    };
    document.querySelector('#toggleImage').onclick=e=>{if(!state.imageProfile)return;state.imageVisible=!state.imageVisible;sourceImage.hidden=!state.imageVisible;document.querySelector('#sourceThumb').hidden=state.imageVisible;e.currentTarget.textContent=state.imageVisible?'HIDE INPUT IMAGE':'SHOW INPUT IMAGE';e.currentTarget.setAttribute('aria-pressed',String(state.imageVisible))};
    const refreshMethod=()=>{document.querySelector('#methodNote').textContent=methodNotes[state.method];document.querySelector('#scanWidth').disabled=state.method==='story';document.querySelector('#softness').disabled=!['soft','zen'].includes(state.method);if(state.inputImage){installProfile(state.inputImage);resize()}updateMotionNote()};
    document.querySelector('#method').onchange=e=>{state.method=e.target.value;refreshMethod()};
    document.querySelector('#scanWidth').oninput=e=>{state.scanWidth=Number(e.target.value);document.querySelector('#scanWidthValue').textContent=`${state.scanWidth}%`;if(state.inputImage){installProfile(state.inputImage);resize()}};
    document.querySelector('#softness').oninput=e=>{state.softness=Number(e.target.value);document.querySelector('#softnessValue').textContent=`${state.softness}%`;if(state.inputImage){installProfile(state.inputImage);resize()}};
    document.querySelector('#motionAmount').oninput=e=>{state.motionAmount=Number(e.target.value);document.querySelector('#motionAmountValue').textContent=`${state.motionAmount}%`;updateMotionNote();draw()};
    document.querySelector('#motionSpeed').oninput=e=>{state.motionSpeed=Number(e.target.value);document.querySelector('#motionSpeedValue').textContent=`${state.motionSpeed}%`;updateMotionNote();draw()};
    document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{state.style=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#resolution').disabled=state.style!=='pixel';resize()});
    document.querySelector('#resolution').oninput=e=>{state.resolution=Number(e.target.value);document.querySelector('#resolutionValue').textContent=`${state.resolution}%`;resize()};
    document.querySelector('#export').onclick=()=>{const {width,height}=exportSize(),out=document.createElement('canvas');out.width=width;out.height=height;if(state.style==='pixel'){const low=document.createElement('canvas');low.width=width;low.height=Math.max(70,Math.round(height*state.resolution/100));paint(low,low.width,low.height);const ctx=out.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(low,0,0,width,height)}else paint(out,width,height);drawVisibleSource(out);out.toBlob(blob=>{if(blob)download(blob,'ambient-gradient.png')},'image/png')};
    document.querySelector('#exportSvg').onclick=exportSvg;
    document.querySelector('#recordVideo').onclick=recordVideo;
    document.querySelector('#copyPalette').onclick=()=>copy((state.imageColors||[]).join('\n'));
    refreshMethod();new ResizeObserver(resize).observe(stage);renderPalette();resize();updateMotionNote();
  </script>
